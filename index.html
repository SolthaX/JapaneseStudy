<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Benkyō</title>
  <meta name="description" content="Japanese study planner: WaniKani, Bunpro, Genki, Quartet, reading and news.">
  <meta name="theme-color" content="#fbf5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15131f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Benkyō">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🌸</span>
      <div>
        <div class="brand-title">Benkyō</div>
        <div class="brand-date" id="today-label"></div>
      </div>
    </div>
    <button class="icon-btn" data-action="open-settings" aria-label="Settings">⚙︎</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today"><span class="tab-ja"></span><span class="tab-en">Today</span></button>
    <button data-tab="calendar"><span class="tab-ja"></span><span class="tab-en">Calendar</span></button>
    <button data-tab="books"><span class="tab-ja"></span><span class="tab-en">Books</span></button>
    <button data-tab="reading"><span class="tab-ja"></span><span class="tab-en">Reading</span></button>
    <button data-tab="news"><span class="tab-ja"></span><span class="tab-en">News</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
