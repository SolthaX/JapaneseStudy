name: Probe external links (temporary)
on:
  push:
    branches: [claude/nhk-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: WaniKani new dashboard announcement
        run: |
          curl -sSL -m 30 -A "Mozilla/5.0" "https://community.wanikani.com/raw/71904/1" | head -c 9000
          echo; echo "===== staff replies mentioning customize ====="
          for n in 2 3 4 5 6 7 8; do curl -sSL -m 20 -A "Mozilla/5.0" "https://community.wanikani.com/raw/71904/$n" | head -c 900; echo; echo "-----"; done
