name: Probe external links (temporary)
on:
  push:
    branches: [claude/nhk-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resources list
        run: |
          curl -sSL -m 30 -A "Mozilla/5.0" -o raw.md "https://community.wanikani.com/raw/16859/1"
          wc -c raw.md
          python3 - <<'PY'
          import re
          s = open('raw.md', encoding='utf-8', errors='ignore').read()
          for line in s.splitlines():
              l = line.strip()
              if re.match(r'^#{1,4}\s', l) or l.startswith('[details'):
                  print('HEAD', re.sub(r'\[details="?([^"\]]*)"?\]', r'\1', l)[:90])
              elif l.startswith(('*', '-', '|')) and '](' in l:
                  names = re.findall(r'\[([^\]]{2,60})\]\(', l)
                  if names: print('  -', ' / '.join(names[:3])[:110])
          PY
